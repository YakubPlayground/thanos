apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thanos-receiver
  template:
    metadata:
      labels:
        app: thanos-receiver
    spec:
      containers:
      - name: thanos-frontend
        image: bitnami/thanos:latest
        args:
        - "query-frontend"
        - "--log.level=info"
          ports:
          - containerPort: 9090