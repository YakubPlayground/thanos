apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-frontend
  namespace: monitoring-testing-october20
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thanos-frontend
  template:
    metadata:
      labels:
        app: thanos-frontend
    spec:
      containers:
      - name: thanos-frontend
        image: bitnami/thanos:latest
        args:
          - "query-frontend"
          - "--http-address=0.0.0.0:9092"
        ports:
        - containerPort: 9092